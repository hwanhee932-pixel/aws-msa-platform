apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: msa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - api.wecnedu.com
        - www.wecnedu.com
      secretName: msa-public-tls

  rules:
    # =========================================================
    # API Gateway
    # api.wecnedu.com -> api-gateway:8080
    # =========================================================
    - host: api.wecnedu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

    # =========================================================
    # Frontend
    # www.wecnedu.com -> frontend-service:80
    # =========================================================
    - host: www.wecnedu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80