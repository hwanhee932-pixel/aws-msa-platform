name: build-push

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-push.yml"

permissions:
  contents: write
  id-token: write

jobs:
  # ==========================================================
  # 1. Build Docker Images and Push to Amazon ECR
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - member-service
          - product-service
          - order-service
          - frontend

    steps:
      # 1. Checkout Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. AWS OIDC Authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-${{ matrix.service }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker Image and Push to ECR
      - name: Build and push
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          SERVICE: ${{ matrix.service }}
          TAG: ${{ github.sha }}

        run: |
          echo "=========================================="
          echo "Service  : $SERVICE"
          echo "Registry : $REGISTRY"
          echo "Tag      : $TAG"
          echo "=========================================="

          if [ "$SERVICE" = "frontend" ]; then

            echo "Building frontend..."

            docker build \
              -f "apps/frontend/Dockerfile" \
              -t "$REGISTRY/$SERVICE:$TAG" \
              .

          else

            echo "Building $SERVICE..."

            docker build \
              -f "apps/$SERVICE/Dockerfile" \
              -t "$REGISTRY/$SERVICE:$TAG" \
              .

          fi

          echo "Pushing $REGISTRY/$SERVICE:$TAG"

          docker push "$REGISTRY/$SERVICE:$TAG"

          echo "Push completed: $REGISTRY/$SERVICE:$TAG"


  # ==========================================================
  # 2. Update GitOps Manifest
  # ==========================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest main branch
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Update Kustomize image tags
      - name: Update production image tags
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          TAG: ${{ github.sha }}

        run: |
          cd k8s/overlays/prod

          kustomize edit set image \
            "$REGISTRY/api-gateway=$REGISTRY/api-gateway:$TAG" \
            "$REGISTRY/member-service=$REGISTRY/member-service:$TAG" \
            "$REGISTRY/product-service=$REGISTRY/product-service:$TAG" \
            "$REGISTRY/order-service=$REGISTRY/order-service:$TAG" \
            "$REGISTRY/frontend=$REGISTRY/frontend:$TAG"

          echo "=========================================="
          echo "Updated production image tags"
          echo "Tag: $TAG"
          echo "=========================================="

          cat kustomization.yaml

      # 3. Commit and Push GitOps Manifest
      - name: Commit and push manifest
        env:
          TAG: ${{ github.sha }}

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/prod/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "chore: deploy $TAG [skip ci]"
          git push origin HEAD:main